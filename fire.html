<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIRE計算ツール｜早期リタイアに必要な資産</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>FIRE計算ツール</h1>
      <p class="subtitle">リタイアに必要な資産を計算</p>

      <div class="card">
        <h2>シミュレーション</h2>

        <label>年間支出（円）</label>
        <input id="annual" type="number" placeholder="例：3000000" />

        <label>想定利回り（%）</label>
        <input id="rate" type="number" placeholder="例：4" />

        <button onclick="calc()">計算する</button>

        <div class="result" id="result"></div>
      </div>

      <!-- 解説 -->
      <div class="card">
        <h2>FIREとは？</h2>
        <p>
          FIRE（Financial Independence, Retire Early）は、
          資産収入で生活できる状態を目指す考え方です。
        </p>
      </div>

      <!-- CTA -->
      <div class="card">
        <h2>投資を始める</h2>

        <p>シミュレーション結果をもとに資産形成を始めましょう</p>

        <p style="font-size: 12px; color: #888">
          ※口座開設は無料・スマホで5分で完了
        </p>

        <!-- TODO: A8.net提携後、実際のアフィリエイトURLに差し替える -->
        <a href="compare.html" class="cta"> ▶ 証券会社を比較して口座を開設する </a>
      </div>
    </div>

    <footer class="site-footer">
      <a href="index.html">トップ</a>
      <a href="about.html">運営者情報・お問い合わせ</a>
      <a href="privacy-policy.html">プライバシーポリシー</a>
    </footer>

    <script>
      function calc() {
        let annual = Number(document.getElementById("annual").value);
        let rate = Number(document.getElementById("rate").value) / 100;

        if (!annual || !rate) {
          alert("すべて入力してください");
          return;
        }

        // 4%ルールベース
        let fireAmount = annual / rate;

        document.getElementById("result").innerHTML =
          "必要資産 : <b>" +
          Math.floor(fireAmount).toLocaleString() +
          " 円</b>";
      }
    </script>
  </body>
</html>
